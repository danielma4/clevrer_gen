# OOD (object count): seven spheres, random placement + velocity, zero collisions.
# Only difference vs the 1-5 ball nocollide set is num (7 > training max of 5).
# Higher max_tries: 0-collision hit rate drops as object count grows.
seed: 42

objects:
  num: 7
  speed: [1, 6]
  direction: random

# Shorter clips (see six_balls_nocollide): same physics, drops the empty tail.
video:
  num_frames: 64

properties:
  shapes: [sphere]
  sizes: {large: 0.35, small: 0.35}

output:
  collision_filter:
    max: 0
  collision_filter_max_tries: 400

render:
  samples: 16
  device: OPTIX
  views:
    perspective: true
    topdown: false
  passes:
    flow: false
