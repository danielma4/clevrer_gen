# Three spheres, random placement + velocity, zero collisions.
# All spheres (same shape) isolates dynamics from shape recognition.
# Filter re-rolls cheap physics until 0 collisions found (~70% hit rate).
seed: 42

objects:
  num: 3
  speed: [1, 6]
  direction: random

properties:
  shapes: [sphere]
  sizes: {large: 0.35, small: 0.35}

output:
  collision_filter:
    max: 0
  collision_filter_max_tries: 200

render:
  samples: 16
  device: OPTIX
  views:
    perspective: true
    topdown: false
  passes:
    flow: false
